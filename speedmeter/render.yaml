services:
  - type: web
    name: speedmeter
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: speedmeter-db
          property: connectionString
databases:
  - name: speedmeter-db
    plan: free
